<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Tourvorschläge – Versuch</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --ink:#22302a; --muted:#66756d; --line:#d9ded9; --bg:#f6f5f0; --accent:#2f6b4f; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; color:var(--ink); background:var(--bg); display:flex; height:100vh; }
  #side { width:400px; min-width:400px; overflow-y:auto; padding:14px 14px 40px; border-right:1px solid var(--line); }
  #map { flex:1; background:#e9ebe6; }
  h1 { font-size:18px; margin:0 0 2px; } .sub { color:var(--muted); margin:0 0 10px; font-size:12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  input[type=text], input[type=number], select { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  .row { display:flex; gap:8px; } .row > div { flex:1; }
  button { font:inherit; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.pri { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .btns { display:flex; gap:8px; margin:12px 0 6px; }
  .lv { display:flex; align-items:center; gap:6px; margin:4px 0; } .lv span { width:110px; font-size:13px; }
  .lv button { flex:1; padding:5px 4px; } .lv button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .opts { font-size:12px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; margin:6px 0; }
  #status { font-size:12px; color:var(--muted); min-height:18px; }
  #notes div { font-size:12.5px; background:#fff7df; border:1px solid #ead9a0; border-radius:8px; padding:6px 9px; margin:6px 0; }
  .card { background:#fff; border:1px solid var(--line); border-left:6px solid #999; border-radius:8px; padding:9px 10px; margin:8px 0; cursor:pointer; }
  .card.sel { box-shadow:0 0 0 2px var(--ink); }
  .card h3 { margin:0; font-size:14px; display:flex; justify-content:space-between; gap:8px; } .card h3 b { white-space:nowrap; }
  .big { font-variant-numeric:tabular-nums; margin:2px 0 3px; }
  .why { font-size:12.5px; color:#1d5a3c; font-weight:500; margin:0 0 4px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; font-size:11.5px; } .chips span { background:#f6dfd8; border-radius:10px; padding:1px 7px; }
  .axes { display:grid; grid-template-columns:78px 1fr 26px; gap:2px 6px; font-size:11.5px; color:var(--muted); margin-top:6px; align-items:center; }
  .axes i { display:block; height:6px; background:#e7ebe5; border-radius:3px; overflow:hidden; } .axes i u { display:block; height:100%; background:var(--accent); }
  .verdict { font-size:11.5px; color:var(--muted); margin-top:4px; }
  .fb { display:none; gap:6px; margin-top:7px; } .card.sel .fb { display:flex; } .fb input { flex:1; min-width:0; }
  .legend { font-size:11.5px; color:var(--muted); } .legend i { display:inline-block; width:14px; height:4px; vertical-align:middle; margin:0 3px 0 8px; }
</style>
</head>
<body>
<div id="side">
  <h1>Tourvorschläge</h1>
  <p class="sub">Versuch am Rechner · Rundtouren zu Fuß und mit dem Rad · Start auch per Klick auf die Karte</p>
  <label>Start</label>
  <div class="row"><div style="flex:3"><input type="text" id="place" list="places" value="Hilden" placeholder="Ort oder „51.17, 6.94“"><datalist id="places"></datalist></div>
    <div><button id="find" style="width:100%">Suchen</button></div></div>
  <div class="row">
    <div><label>Aktivität</label><select id="activity"></select></div>
    <div id="tbox"><label>Schwierigkeit bis</label><select id="t_level"><option value="1">T1 gemütlich</option><option value="2" selected>T2</option><option value="3">T3</option><option value="4">T4</option><option value="5">T5 wild</option></select></div>
  </div>
  <div class="row">
    <div><label>Dauer von – bis (Stunden) <span id="km"></span></label><div class="row"><input type="number" id="h0" value="1.5" min="0.25" max="10" step="0.25"><input type="number" id="h1" value="2.5" min="0.25" max="10" step="0.25"></div></div>
    <div><label>Höhenmeter von – bis</label><div class="row"><input type="number" id="up0" min="0" step="50" placeholder="auto"><input type="number" id="up1" min="0" step="50" placeholder="auto"></div></div>
  </div>
  <div class="row">
    <div><label>Tempo</label><select id="pace"><option>gemütlich</option><option selected>normal</option><option>zügig</option></select></div>
    <div><label>Anstrengung</label><select id="effort" title="gibt die Höhenmeter vor, wenn dort nichts eingetragen ist"><option>leicht</option><option selected>mittel</option><option>sportlich</option></select></div>
    <div><label>Wegbeschaffenheit</label><select id="surface"></select></div>
  </div>
  <label>Was ist dir wichtig?</label>
  <div class="lv" data-k="natur"><span>Natur</span></div>
  <div class="lv" data-k="ruhe"><span>Ruhe</span></div>
  <div class="lv" data-k="bekannt"><span>Bekannte Wege</span></div>
  <div class="opts"><label style="margin:0"><input type="checkbox" id="wasser"> am Wasser entlang</label>
    <label style="margin:0"><input type="checkbox" id="tips"> mit KI-Regionswissen</label></div>
  <div class="btns"><button class="pri" id="go">Vorschläge</button><button id="again">Neue Vorschläge</button></div>
  <div id="status"></div><div id="notes"></div>
  <div class="opts"><label style="margin:0"><input type="checkbox" id="all"> alle Kandidaten</label>
    <label style="margin:0"><input type="checkbox" id="byclass" checked> gewählte Runde nach Wegart färben</label>
    <label style="margin:0"><input type="checkbox" id="known"> bekannte Wege zeigen</label></div>
  <div class="legend">Wegart:<i style="background:#2e8b57"></i>am Wald<i style="background:#8a6d3b"></i>Weg<i style="background:#e08a2c"></i>Straße / Häuser<i style="background:#c62828"></i>an einer Straße mit Autos</div>
  <div id="cards"></div>
</div>
<div id="map"></div>
<script>
// the page may sit behind a path (a preview pane) – call the server next to the page, not at the host's root
const BASE = location.pathname.replace(/[^\/]*\.[^\/]*$/, '').replace(/\/?$/, '/');
const $ = id => document.getElementById(id), P = new URLSearchParams(location.search);
const COLORS = ['#1f5fbf', '#c2185b', '#6a1b9a', '#00838f', '#ef6c00'], CLS = {W:'#2e8b57', P:'#8a6d3b', S:'#e08a2c', G:'#c62828'};
const AXES = [['natur','Natur'], ['ruhe','Ruhe'], ['weg','Weg'], ['besonderes','Besonderes'], ['form','Form']];
const SURFACE = {foot: [['befestigt','befestigt'], ['gemischt','gemischt'], ['natur','Naturwege']], wheel: [['glatt','glatt'], ['gemischt','gemischt'], ['rau','rau']]};
const map = L.map('map').setView([51.168, 6.9395], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(map);
const layer = L.layerGroup().addTo(map), knownLayer = L.layerGroup().addTo(map);
let start = [6.9395, 51.168], marker = null, result = null, selected = null, seed = 1, paces = {};
const level = {natur: 'mittel', ruhe: 'mittel', bekannt: 'mittel'};

document.querySelectorAll('.lv').forEach(row => ['niedrig', 'mittel', 'hoch'].forEach(v => {
  const b = document.createElement('button'); b.textContent = v; b.className = v === 'mittel' ? 'on' : '';
  b.onclick = () => { level[row.dataset.k] = v; row.querySelectorAll('button').forEach(x => x.className = x === b ? 'on' : ''); };
  row.appendChild(b); }));
function forActivity() {
  const foot = $('activity').value === 'hike';
  $('tbox').style.display = foot ? '' : 'none';
  $('surface').innerHTML = SURFACE[foot ? 'foot' : 'wheel'].map(o => `<option value="${o[0]}"${o[0] === 'gemischt' ? ' selected' : ''}>${o[1]}</option>`).join('');
}
function showKm() {
  const p = (paces[$('activity').value] || {})[$('pace').value];
  $('km').textContent = p ? `≈ ${km(Math.round($('h0').value * p))}–${km(Math.round($('h1').value * p))} km` : '';
}
$('activity').onchange = () => { forActivity(); showKm(); };
['pace', 'h0', 'h1'].forEach(id => $(id).oninput = showKm);
function setStart(lonlat, name) {
  start = lonlat; if (name) $('place').value = name;
  if (marker) marker.remove();
  marker = L.circleMarker([start[1], start[0]], {radius: 7, color: '#fff', weight: 2, fillColor: '#111', fillOpacity: 1}).addTo(map);
}
map.on('click', e => setStart([e.latlng.lng, e.latlng.lat], e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5)));
async function find() {
  const r = await (await fetch(BASE + 'place?q=' + encodeURIComponent($('place').value))).json();
  if (r.error) { $('status').textContent = r.error; return false; }
  setStart(r.lonlat, r.name); map.setView([r.lonlat[1], r.lonlat[0]], 13); return true;
}
$('find').onclick = find;
$('place').onkeydown = e => { if (e.key === 'Enter') find(); };
const wish = () => ({start, start_name: $('place').value, activity: $('activity').value, t_level: +$('t_level').value, hours: [+$('h0').value, +$('h1').value],
  ascent: $('up0').value !== '' && $('up1').value !== '' ? [+$('up0').value, +$('up1').value] : null,
  pace: $('pace').value, effort: $('effort').value, surface: $('surface').value, ...level, wasser: $('wasser').checked, tips: $('tips').checked, seed});
async function go() {
  $('status').textContent = 'Runden werden gesucht …'; $('cards').innerHTML = ''; $('notes').innerHTML = '';
  const r = await (await fetch(BASE + 'suggest', {method: 'POST', body: JSON.stringify(wish())})).json();
  if (r.error) { $('status').textContent = r.error; return; }
  show(r);
}
$('go').onclick = () => { seed = 1; go(); };
$('again').onclick = () => { seed++; go(); };
const km = x => String(x).replace('.', ','), hm = h => Math.floor(h) + ':' + String(Math.round((h % 1) * 60)).padStart(2, '0');
function show(r) {
  result = r; selected = null;
  const shown = r.candidates.filter(c => c.chosen);
  $('status').textContent = `${shown.length} Vorschläge aus ${r.candidates.length} Runden · ${km(r.seconds)} s · ${hm(r.hours[0])}–${hm(r.hours[1])} h (${km(r.target_km[0])}–${km(r.target_km[1])} km) · ↑ ${r.ascent[0]}–${r.ascent[1]} m · Charakter ${r.character.word} · Stand ${r.version}`;
  $('notes').innerHTML = r.notes.map(n => `<div>${n}</div>`).join('');
  $('cards').innerHTML = '';
  shown.forEach((c, i) => {
    const n = c.numbers, d = document.createElement('div');
    d.className = 'card'; d.style.borderLeftColor = COLORS[i % 5];
    d.innerHTML = `<h3><span>${i + 1} · ${c.name}</span><b>${Math.round(c.score)} Punkte</b></h3>
      <div class="big">${km(n.km)} km · ${hm(n.hours)} h · ↑ ${n.ascent} m</div>
      <div class="why">${c.reasons.join(' · ')}</div>
      <div class="chips">${c.hints.map(h => `<span>${h}</span>`).join('')}</div>
      <div class="axes">${AXES.map(a => `<span>${a[1]}</span><i><u style="width:${Math.round(100 * c.axes[a[0]])}%"></u></i><span>${Math.round(100 * c.axes[a[0]])}</span>`).join('')}</div>
      <div class="verdict">${c.why} · am Wald ${n.forest_pct} % · durch Häuser ${n.town_pct} % · Belag fest ${n.ground_pct[0] + n.ground_pct[1]} % / Natur ${n.ground_pct[2] + n.ground_pct[3]} %</div>
      <div class="fb"><input type="text" placeholder="Kommentar zu dieser Runde"><button>Kommentar senden</button></div>`;
    d.onclick = () => { selected = c.id; draw(); };
    d.querySelector('.fb').onclick = e => e.stopPropagation();
    d.querySelector('.fb button').onclick = async () => {
      await fetch(BASE + 'feedback', {method: 'POST', body: JSON.stringify({run: r.run, candidate: c.id, name: c.name, place: r.wish.start_name,
        comment: d.querySelector('input').value, score: c.score, axes: c.axes, numbers: n, wish: r.wish, version: r.version})});
      d.querySelector('.fb').innerHTML = '<i>Kommentar gespeichert.</i>';
    };
    c.card = d; $('cards').appendChild(d);
  });
  setStart(r.wish.start, r.wish.start_name);
  if (P.get('only')) selected = (shown[+P.get('only') - 1] || {}).id;
  draw(true);
}
function draw(fit) {
  layer.clearLayers();
  const shown = result.candidates.filter(c => c.chosen), ll = c => c.coords.map(p => [p[1], p[0]]);
  if ($('all').checked) result.candidates.filter(c => !c.chosen).forEach(c => L.polyline(ll(c), {color: '#777', weight: 1.5, opacity: 0.45}).addTo(layer));
  const bounds = [];
  shown.forEach((c, i) => {
    c.card.classList.toggle('sel', c.id === selected);
    if (P.get('only') && c.id !== selected) return;
    const pts = ll(c); bounds.push(...pts);
    if (c.id === selected && $('byclass').checked) {
      L.polyline(pts, {color: '#fff', weight: 8, opacity: 0.9}).addTo(layer);
      let from = 0;
      for (let k = 1; k <= c.cls.length; k++) if (k === c.cls.length || c.cls[k] !== c.cls[from]) {
        L.polyline(pts.slice(from, k + 1), {color: CLS[c.cls[from]], weight: 5}).addTo(layer); from = k; }
    } else L.polyline(pts, {color: COLORS[i % 5], weight: c.id === selected ? 6 : 3.5, opacity: selected && c.id !== selected ? 0.45 : 0.9}).addTo(layer);
  });
  if (fit && bounds.length) map.fitBounds(bounds, {padding: [30, 30]});
}
['all', 'byclass'].forEach(id => $(id).onchange = () => result && draw());
$('known').onchange = async () => {
  knownLayer.clearLayers();
  if (!$('known').checked) return;
  const r = await (await fetch(BASE + `known?lon=${start[0]}&lat=${start[1]}&activity=${$('activity').value}`)).json();
  r.routes.forEach(k => k.lines.forEach(l => L.polyline(l.map(p => [p[1], p[0]]), {color: '#7b3fa0', weight: 'in'.includes(k.net[0]) ? 4 : k.net[0] === 'r' ? 3 : 2, opacity: 0.5})
    .bindTooltip(k.name, {sticky: true}).addTo(knownLayer)));
};
fetch(BASE + 'places').then(r => r.json()).then(d => {
  $('places').innerHTML = Object.keys(d.places).map(k => `<option value="${k}">`).join('');
  $('activity').innerHTML = Object.entries(d.activities).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  paces = d.paces; forActivity(); showKm();
  if (P.get('run')) fetch(BASE + 'run/' + P.get('run')).then(r => r.json()).then(r => {
    const w = r.wish;
    $('activity').value = w.activity; forActivity(); $('t_level').value = w.t_level; $('h0').value = +w.hours[0].toFixed(2); $('h1').value = +w.hours[1].toFixed(2);
    if (w.ascent) { $('up0').value = w.ascent[0]; $('up1').value = w.ascent[1]; }
    $('effort').value = w.effort; $('surface').value = w.surface; $('wasser').checked = w.wasser; $('tips').checked = w.tips;
    document.querySelectorAll('.lv').forEach(row => row.querySelectorAll('button').forEach(b => b.className = b.textContent === w[row.dataset.k] ? 'on' : ''));
    Object.keys(level).forEach(k => level[k] = w[k]);
    showKm(); show(r); });
});
setStart(start);
</script>
</body>
</html>
