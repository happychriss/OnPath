# Cloud Run Job definition of the cell builder, one per environment (docs/design/map-hosting.md §Builder).
# Applied by .github/workflows/maps-deploy.yml with `gcloud run jobs replace` after envsubst fills the placeholder values
# (create-or-update, declarative – the IAM bindings set by gcp-setup.sh on the job stay).
#
# Resources: a cell peaks at ~2.3 GB RAM (map-cells.md §3). Cloud Run's disk is memory, and it also holds the
# Planetiler sources (~1.4 GB, copied in from the bucket), the OSM extract and the work folder → 8 GiB.
# 8 GiB needs at least 2 vCPU. Task timeout 60 min (up to CELLS_PER_EXECUTION cells of ~3–5 min each + setup);
# one retry (a crash/OOM; a failed *cell* is not a failed task). Parallelism 1: never more than one builder.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  labels:
    app: onpath-maps
    env: ${ENV_NAME}
spec:
  template:
    metadata:
      labels:
        app: onpath-maps
        env: ${ENV_NAME}
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      parallelism: 1
      taskCount: 1
      template:
        spec:
          serviceAccountName: ${BUILDER_SA}
          timeoutSeconds: ${TASK_TIMEOUT_S}
          maxRetries: 1
          containers:
            - image: ${IMAGE}
              resources:
                limits:
                  cpu: "${JOB_CPU}"
                  memory: ${JOB_MEMORY}
              env:
                - name: ONPATH_ENV
                  value: ${ENV_NAME}
                - name: FORMAT
                  value: "2" # cells ship only in format 2 (map-cells.md Q11); the doorman sends FORMAT per execution too
                - name: SRC_DIR
                  value: /src
                - name: R2_ACCOUNT_ID
                  value: ${R2_ACCOUNT_ID}
                # buckets were created with EU jurisdiction → https://<account>.eu.r2.cloudflarestorage.com
                - name: R2_JURISDICTION
                  value: ${R2_JURISDICTION}
                - name: R2_BUCKET
                  value: ${R2_BUCKET}
                - name: JAVA_XMX
                  value: 2g
                - name: R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-access-key-id-${ENV_SHORT}
                      key: latest
                - name: R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-secret-access-key-${ENV_SHORT}
                      key: latest
              volumeMounts:
                - name: src
                  mountPath: /src
          volumes:
            # source bucket (OSM extracts + Planetiler sources) as a folder (Cloud Storage FUSE)
            - name: src
              csi:
                driver: gcsfuse.run.googleapis.com
                readOnly: false
                volumeAttributes:
                  bucketName: ${SRC_BUCKET}
