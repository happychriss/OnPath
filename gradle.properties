org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
# Build cache (owner 2026-10-28: shorter builds) – reused outputs locally and on CI (setup-gradle keeps it)
org.gradle.caching=true
# Configuration cache (owner 2026-10-31 "D"): no problems for unit + screenshot tests, assembleDebug, lint, record and
# the -Ponpath.e2e=true emulator build; a repeated gate skips the ~5-10 s configuration phase
org.gradle.configuration-cache=true
# Warm daemon instead of `./gradlew --stop` after every gate (owner 2026-10-31 "D"): an idle daemon ends itself after
# 10 minutes, so it does not hold the memory for the default 3 hours (donald: RAM is the limit)
org.gradle.daemon.idletimeout=600000
# The Kotlin compile daemon (one per machine, shared by every session's build) inherits -Xmx4g otherwise and grows to
# ~4.5 GB; with 2 GB it stays at ~2.6 GB, equally fast (measured 2026-10-31: full app compile 52 s vs 47 s, small change
# 8 s both). In-process compiling would save ~1 GB more but made each gate 20-30 s slower. It ends with its Gradle daemon.
kotlin.daemon.jvmargs=-Xmx2g
