# Builds and publishes an OnPath release (GitHub Release with the APK) – the app's
# "Check for updates" (Settings → Updates) installs it on the phone.
#
# Trigger: a push to main that changes the version (default appVersion in app/build.gradle.kts)
# or adds release notes (docs/release-notes/vX.Y.Z.md). If a release for that version already
# exists, nothing happens. The workflow creates the tag vX.Y.Z itself (cloud sessions may not
# push tags or create releases). It can also be started by hand: Actions → Release → Run workflow.
#
# Release notes: docs/release-notes/vX.Y.Z.md if present.
# Signing: the fixed test key in keystore/ (updates install in place). A secret Play release key
# will come later via repository secrets.
# Map key: the APK talks to the TEST map server (Cloudflare doorman + Cloud Run builder). Its app key is the
# newest entry of the GitHub environment "test" secret ONPATH_APP_KEYS ("old,new" during rotation) – the same
# secret maps-deploy.yml gives the doorman. Masked in logs; never written to the repository.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
      - "docs/release-notes/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Owner decisions 2026-10-22: the full emulator suite (e2e.yml) runs beside the release on every push to main; before
  # the build only a short start test (the app opens, also with a saved plan – 0.9.1 crashed there). Unit tests below.
  smoke:
    uses: ./.github/workflows/e2e.yml
    with:
      tests: com.onpath.app.e2e.StartSmokeE2ETest

  build:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Version and "already released?" check
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*?: "\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$VERSION" ] || { echo "No default appVersion found in app/build.gradle.kts"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists – nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Will release OnPath $VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        if: steps.ver.outputs.skip != 'true'
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.skip != 'true'

      - name: Unit tests
        if: steps.ver.outputs.skip != 'true'
        run: ./gradlew --no-daemon testDebugUnitTest -PappVersion="$VERSION"

      # World overview map in the APK (docs/map-pipeline.md §9b): map data is not in git; the files are built on the
      # laptop (tools/build_overview.sh) and stored in a versioned folder (R2 overview/<date>/). Repository variable
      # ONPATH_OVERVIEW_URL = that folder's URL (ends with /), holding base.pmtiles, hillshade.pmtiles and SHA256SUMS.
      # Not set → the APK has no overview (empty map below zoom 10 outside downloaded cells), with a warning.
      - name: Overview map
        if: steps.ver.outputs.skip != 'true'
        env:
          OVERVIEW_URL: ${{ vars.ONPATH_OVERVIEW_URL }}
        run: |
          if [ -z "$OVERVIEW_URL" ]; then
            echo "::warning::ONPATH_OVERVIEW_URL not set – this APK ships without the overview map"; exit 0
          fi
          DIR="$RUNNER_TEMP/overview-assets/overview"
          mkdir -p "$DIR"
          for f in SHA256SUMS base.pmtiles hillshade.pmtiles; do
            curl -fsSL --retry 5 --retry-delay 5 -o "$DIR/$f" "${OVERVIEW_URL%/}/$f"
          done
          (cd "$DIR" && grep -E ' \*?(base|hillshade)\.pmtiles$' SHA256SUMS | sha256sum -c -) && rm "$DIR/SHA256SUMS"
          ls -la "$DIR"
          echo "ONPATH_OVERVIEW_ASSETS=$RUNNER_TEMP/overview-assets" >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.ver.outputs.skip != 'true'
        env:
          APP_KEYS: ${{ secrets.ONPATH_APP_KEYS }}
        run: |
          KEY="${APP_KEYS##*,}"
          KEY="$(echo "$KEY" | tr -d '[:space:]')"
          if [ -n "$KEY" ]; then echo "::add-mask::$KEY"; else echo "::warning::ONPATH_APP_KEYS (environment test) is empty – this APK cannot download maps"; fi
          ONPATH_MAP_KEY_TEST="$KEY" ./gradlew --no-daemon assembleDebug -PappVersion="$VERSION"

      - name: Prepare release files
        if: steps.ver.outputs.skip != 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/onpath-$VERSION.apk"
          (cd dist && sha256sum * > SHA256SUMS)
          NOTES="docs/release-notes/v$VERSION.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" dist/notes.md; else echo "OnPath $VERSION" > dist/notes.md; fi
          cat >> dist/notes.md <<'TXT'

          ---
          **Install on the phone:** open this page on the phone, tap the `.apk` below, then Install.
          Already installed? OnPath → Settings → Updates → Check for updates.
          Map data: OnPath → Settings → Map data → Import map data (.zip).
          TXT
          ls -la dist

      - name: Publish GitHub release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: OnPath ${{ env.VERSION }}
          body_path: dist/notes.md
          # Not a pre-release: the app's update check reads /releases/latest, which skips pre-releases.
          prerelease: false
          make_latest: true
          files: |
            dist/onpath-${{ env.VERSION }}.apk
            dist/SHA256SUMS
