# Builds and publishes an OnPath release (GitHub Release with the APK) – the app's
# "Check for updates" (Settings → Updates) installs it on the phone.
#
# Trigger: a push to main that changes the version (default appVersion in app/build.gradle.kts)
# or adds release notes (docs/release-notes/vX.Y.Z.md). If a release for that version already
# exists, nothing happens. The workflow creates the tag vX.Y.Z itself (cloud sessions may not
# push tags or create releases). It can also be started by hand: Actions → Release → Run workflow.
#
# Release notes: docs/release-notes/vX.Y.Z.md if present.
# Signing: the fixed test key in keystore/ (updates install in place). The Google Play bundle (A-003, build type
# "play": no own updater) is signed with the owner's upload key from repository secrets – see "Build Play bundle".
# Map key: the APK talks to the TEST map server (Cloudflare doorman + Cloud Run builder). Its app key is the
# newest entry of the GitHub environment "test" secret ONPATH_APP_KEYS ("old,new" during rotation) – the same
# secret maps-deploy.yml gives the doorman. Masked in logs; never written to the repository.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
      - "docs/release-notes/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Owner decisions: the full emulator suite (e2e.yml) runs beside the release on every push to main (not waited for);
  # before publishing only the short start test (the app opens, also with a saved plan). The Release-Rundgang is not
  # run here (owner 2026-10-31, docs/release-rundgang.md): a release made on donald runs it locally first
  # (tools/ci/release_rundgang.sh), a release from elsewhere goes out without it. Unit tests below. Smoke and build run
  # side by side, publish waits for both.
  smoke:
    uses: ./.github/workflows/e2e.yml
    with:
      tests: com.onpath.app.e2e.StartSmokeE2ETest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: test
    outputs:
      skip: ${{ steps.ver.outputs.skip }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags + history: the risk-based tests compare with the last release

      - name: Version and "already released?" check
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*?: "\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$VERSION" ] || { echo "No default appVersion found in app/build.gradle.kts"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists – nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Will release OnPath $VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.ver.outputs.skip != 'true'
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        if: steps.ver.outputs.skip != 'true'

      # Risk-based (owner): the core-feature tests always, plus the packages changed since the last release
      # (tools/ci/risk_tests.py); build files / BRouter → everything. The full suite runs after every push (unit.yml).
      - name: Unit tests (risk-based)
        if: steps.ver.outputs.skip != 'true'
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          CHANGED=$([ -n "$LAST" ] && git diff --name-only "$LAST" HEAD || true)
          ARGS=$(python3 tools/ci/risk_tests.py $CHANGED)
          echo "Last release: ${LAST:-none} · tests: ${ARGS:-all}"
          # the filter belongs to the app's test task only (the :strings module has no such tests and would fail)
          eval ./gradlew --no-daemon :app:testDebugUnitTest $ARGS :strings:testDebugUnitTest -PappVersion="$VERSION"

      # World overview map in the APK (docs/map-pipeline.md §9b): map data is not in git; the files are built on the
      # laptop (tools/build_overview.sh) and stored in a versioned folder (R2 overview/<date>/). Repository variable
      # ONPATH_OVERVIEW_URL = that folder's URL (ends with /), holding base.pmtiles, hillshade.pmtiles and SHA256SUMS.
      # Not set → the APK has no overview (empty map below zoom 10 outside downloaded cells), with a warning.
      - name: Overview map
        if: steps.ver.outputs.skip != 'true'
        env:
          OVERVIEW_URL: ${{ vars.ONPATH_OVERVIEW_URL }}
        run: |
          if [ -z "$OVERVIEW_URL" ]; then
            echo "::warning::ONPATH_OVERVIEW_URL not set – this APK ships without the overview map"; exit 0
          fi
          DIR="$RUNNER_TEMP/overview-assets/overview"
          mkdir -p "$DIR"
          for f in SHA256SUMS base.pmtiles hillshade.pmtiles; do
            curl -fsSL --retry 5 --retry-delay 5 -o "$DIR/$f" "${OVERVIEW_URL%/}/$f"
          done
          (cd "$DIR" && grep -E ' \*?(base|hillshade)\.pmtiles$' SHA256SUMS | sha256sum -c -) && rm "$DIR/SHA256SUMS"
          ls -la "$DIR"
          echo "ONPATH_OVERVIEW_ASSETS=$RUNNER_TEMP/overview-assets" >> "$GITHUB_ENV"

      - name: Build APK
        if: steps.ver.outputs.skip != 'true'
        env:
          APP_KEYS: ${{ secrets.ONPATH_APP_KEYS }}
        run: |
          KEY="${APP_KEYS##*,}"
          KEY="$(echo "$KEY" | tr -d '[:space:]')"
          if [ -n "$KEY" ]; then echo "::add-mask::$KEY"; else echo "::warning::ONPATH_APP_KEYS (environment test) is empty – this APK cannot download maps"; fi
          ONPATH_MAP_KEY_TEST="$KEY" ./gradlew --no-daemon assembleDebug -PappVersion="$VERSION"

      # Google Play (A-003): the same app as the APK without its own updater (build type "play", app/build.gradle.kts),
      # as a signed App Bundle for the Play Console's closed test. Signed with the owner's upload key from the secrets
      # ONPATH_UPLOAD_KEYSTORE_B64 (the .jks file, base64), ONPATH_UPLOAD_KEYSTORE_PASSWORD, ONPATH_UPLOAD_KEY_ALIAS,
      # ONPATH_UPLOAD_KEY_PASSWORD – never in the repository. Missing → skipped with a warning; the APK release goes on.
      # The merged manifest is checked: no REQUEST_INSTALL_PACKAGES (Play forbids self-updating apps).
      - name: Build Play bundle (AAB)
        id: aab
        if: steps.ver.outputs.skip != 'true'
        env:
          APP_KEYS: ${{ secrets.ONPATH_APP_KEYS }}
          UPLOAD_B64: ${{ secrets.ONPATH_UPLOAD_KEYSTORE_B64 }}
          ONPATH_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ONPATH_UPLOAD_KEYSTORE_PASSWORD }}
          ONPATH_UPLOAD_KEY_ALIAS: ${{ secrets.ONPATH_UPLOAD_KEY_ALIAS }}
          ONPATH_UPLOAD_KEY_PASSWORD: ${{ secrets.ONPATH_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_B64" ] || [ -z "$ONPATH_UPLOAD_KEYSTORE_PASSWORD" ] || [ -z "$ONPATH_UPLOAD_KEY_ALIAS" ] || [ -z "$ONPATH_UPLOAD_KEY_PASSWORD" ]; then
            echo "::warning::Play upload key secrets not set (ONPATH_UPLOAD_KEYSTORE_B64 / _PASSWORD / ONPATH_UPLOAD_KEY_ALIAS / _PASSWORD) – no Play bundle this time; the APK release goes on"
            echo "built=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KEY="${APP_KEYS##*,}"; KEY="$(echo "$KEY" | tr -d '[:space:]')"
          [ -n "$KEY" ] && echo "::add-mask::$KEY"
          export ONPATH_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$UPLOAD_B64" | base64 -d > "$ONPATH_UPLOAD_KEYSTORE"
          ONPATH_MAP_KEY_TEST="$KEY" ./gradlew --no-daemon bundlePlay -PappVersion="$VERSION"
          rm -f "$ONPATH_UPLOAD_KEYSTORE"
          M=$(find app/build/intermediates -path '*play*' -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          [ -n "$M" ] || { echo "::error::merged manifest of the play build not found"; exit 1; }
          if grep -q 'REQUEST_INSTALL_PACKAGES' "$M"; then echo "::error::play build asks for REQUEST_INSTALL_PACKAGES ($M)"; exit 1; fi
          echo "Play manifest checked: no REQUEST_INSTALL_PACKAGES ($M)"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        if: steps.ver.outputs.skip != 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/onpath-$VERSION.apk"
          # the Play bundle is for the Play Console, not for the GitHub release page: a separate artifact below
          if [ "${{ steps.aab.outputs.built }}" = true ]; then
            mkdir -p play && cp app/build/outputs/bundle/play/app-play.aab "play/onpath-$VERSION-play.aab"
          fi
          (cd dist && sha256sum * > SHA256SUMS)
          NOTES="docs/release-notes/v$VERSION.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" dist/notes.md; else echo "OnPath $VERSION" > dist/notes.md; fi
          cat >> dist/notes.md <<'TXT'

          ---
          **Install on the phone:** open this page on the phone, tap the `.apk` below, then Install.
          Already installed? OnPath → Settings → Updates → Check for updates.
          Map data: OnPath → Settings → Map data → Import map data (.zip).
          TXT
          ls -la dist

      - name: Keep the release files for publishing
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          retention-days: 3

      # The owner downloads it from the run (Actions → Release → Artifacts) and uploads it in the Play Console.
      - name: Keep the Play bundle
        if: steps.ver.outputs.skip != 'true' && steps.aab.outputs.built == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle
          path: play/
          retention-days: 30

  # Publishes only when the start test on the emulator and the unit tests + APK build are all green.
  publish:
    needs: [smoke, build]
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: OnPath ${{ env.VERSION }}
          body_path: dist/notes.md
          # Not a pre-release: the app's update check reads /releases/latest, which skips pre-releases.
          prerelease: false
          make_latest: true
          files: |
            dist/onpath-${{ env.VERSION }}.apk
            dist/SHA256SUMS
