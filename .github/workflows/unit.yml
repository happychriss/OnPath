# All JVM unit tests (incl. the screenshot tests) after every push to main that touches the app – beside the release,
# not a gate (the release runs only the risk-based selection, tools/ci/risk_tests.py; owner 2026-10-28). Like the E2E
# run: a red run is fixed at once.
name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "strings/**"
      - "tools/ci/**"
      - "*.gradle.kts"
      - "gradle/**"
      - ".github/workflows/unit.yml"
  workflow_dispatch:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Risk selection script
        run: cd tools/ci && python3 -m unittest -q test_risk_tests
      - name: All unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-report
          path: app/build/reports/tests/
          retention-days: 7
