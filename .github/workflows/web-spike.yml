# Web planner spike (docs/design/web-planner.md §6): builds the Wasm routing engine from the app's own code with
# TeaVM, builds the web page, and checks that 20 routes come out the same in headless Chromium as on the JVM.
# Only for the web-spike branch – nothing here touches the app build or main.
#
# Layout (web-planner.md §9 "CI"): build (engine + page, uploaded as artifact "web-build") → in parallel: jvm (the
# app's tests of the shared files, JVM routes, Wasm = JVM checks, browser compare, host tests) and smokes (4 machines,
# browser smokes balanced by time) → deploy (only when every job above is green) + results (one artifact as before).
# The TeaVM build is skipped when nothing it compiles changed (cache key = hash of every file the engine build reads).
name: Web spike

on:
  push:
    branches: [web-spike]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the planner host to Cloudflare (test) after the checks"
        type: boolean
        default: false
  # called by cloudflare-setup.yml after the one-time setup (a dispatch needs the file on main; a call does not)
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false

concurrency:
  group: web-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The web never drifts silently from the app (docs/design/web-planner.md §14): an app file the web mirrors that
      # changed since it was last checked turns this run red; perf / memory-relevant changes in shared code are listed.
      - name: Web ⇄ app parity (web/parity.json)
        run: |
          node web/parity/check.mjs --report "$RUNNER_TEMP/parity.md" || { cat "$RUNNER_TEMP/parity.md" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          cat "$RUNNER_TEMP/parity.md" >> "$GITHUB_STEP_SUMMARY"

      # The Wasm engine + overview style, reused when nothing the engine build reads changed. Key = every input of
      # web/engine/build.gradle.kts (its own sources, the app's Kotlin it compiles in place – appFiles + appTests,
      # BRouter sources and jars, the JVM-test stubs, the app's strings, the style overviewStyle merges), the Gradle
      # wrapper and this workflow. When unsure whether a file matters it is in the key (a miss only costs time).
      - name: Engine cache
        id: engine
        uses: actions/cache/restore@v4
        with:
          path: |
            web/engine/build/generated/teavm/wasm-gc
            web/engine/build/style
          key: web-engine-v1-${{ runner.os }}-${{ hashFiles('web/engine/**', 'app/src/main/java/**', 'app/src/test/java/com/onpath/app/**', 'app/libs/**', 'app/src/main/assets/**', 'tools/routing/jvm-test/**', 'strings/**', 'web/strings/**', 'gradle/**', 'gradlew', 'gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', '.github/workflows/web-spike.yml') }}

      - uses: actions/setup-java@v4
        if: steps.engine.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.engine.outputs.cache-hit != 'true'

      # the app's own tests of the shared files (appTests) + WebImportTest run in the jvm job, on every run
      - name: Build the Wasm engine (TeaVM)
        if: steps.engine.outputs.cache-hit != 'true'
        run: ./gradlew -p web/engine --no-daemon generateWasmGC copyWasmGCRuntime overviewStyle

      - name: Engine cache (save)
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            web/engine/build/generated/teavm/wasm-gc
            web/engine/build/style
          key: ${{ steps.engine.outputs.cache-primary-key }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Texts – no hard-coded user texts in the page, every web text in every language (web/strings)
        run: node web/app/test/texts-check.mjs

      # The APK's world overview (docs/map-pipeline.md §9b), from the same GitHub release the app's release workflow
      # downloads (repository variable ONPATH_OVERVIEW_URL there); checked against its SHA256SUMS. Served next to the
      # page so the map is never blank below zoom 10 (docs/design/web-planner.md §16).
      - name: World overview files
        env:
          OVERVIEW_URL: ${{ vars.ONPATH_OVERVIEW_URL || 'https://github.com/happychriss/OnPath/releases/download/overview-2026-10-22/' }}
        run: |
          DIR="$RUNNER_TEMP/overview"; mkdir -p "$DIR"
          for f in SHA256SUMS base.pmtiles hillshade.pmtiles; do
            curl -fsSL --retry 5 --retry-delay 5 -o "$DIR/$f" "${OVERVIEW_URL%/}/$f"
          done
          (cd "$DIR" && grep -E ' \*?(base|hillshade)\.pmtiles$' SHA256SUMS | sha256sum -c -)
          echo "ONPATH_OVERVIEW_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build the web page
        working-directory: web/app
        run: |
          npm ci
          npm run build

      # one artifact for the jobs below: the built page (web/app/dist) and the engine files the Node checks load
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          retention-days: 3
          if-no-files-found: error
          path: |
            web/app/dist
            web/engine/build/generated/teavm/wasm-gc
            web/engine/build/style

      - name: Sizes
        if: always()
        run: |
          ls -la web/engine/build/generated/teavm/wasm-gc/ || true
          gzip -9c web/engine/build/generated/teavm/wasm-gc/onpath-web-engine.wasm | wc -c || true

  jvm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      # BRouter routing data for Südtirol (E10_N45, ~200 MB), refreshed weekly. The JVM and the browser read the
      # same file in one run, so a newer brouter.de version never makes them differ.
      - name: Week number (cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: segments
          key: rd5-E10_N45-${{ steps.week.outputs.week }}
      - name: Routing data
        run: |
          mkdir -p segments
          [ -s segments/E10_N45.rd5 ] || curl -fsS --retry 3 -o segments/E10_N45.rd5 https://brouter.de/brouter/segments4/E10_N45.rd5
          ls -la segments

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      # test = the app's own tests of the shared files (appTests) + WebImportTest (writes build/jvm-gpx.json)
      - name: The app's tests of the shared files + routes on the JVM (same engine code)
        run: ./gradlew -p web/engine --no-daemon test runJvm -Psegments=$GITHUB_WORKSPACE/segments

      - name: Engine texts follow the page's language (German / English, decimal comma)
        run: node web/app/test/lang-engine.mjs $GITHUB_WORKSPACE/segments

      - name: Plan sync in Wasm = the JVM's frozen bytes (keys, blob)
        run: node web/app/test/sync-engine.mjs

      - name: GPX import + long-route rule in Wasm = the JVM (the web's SAX stand-in reads like the JDK's)
        run: node web/app/test/gpx-engine.mjs

      - name: Planner host tests (web/host)
        working-directory: web/host
        run: node --test

      - name: Playwright's Chromium
        working-directory: web/app
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Routes in headless Chromium, compared with the JVM
        working-directory: web/app
        run: node test/browser-compare.mjs $GITHUB_WORKSPACE/segments

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-jvm
          retention-days: 3
          if-no-files-found: ignore
          path: |
            web/engine/build/*.json
            web/engine/build/*.png

  # The browser smokes on 4 machines, balanced by their times (each group ~2.5 min). Each smoke stays its own step, so
  # a failure's log is that smoke's alone; a new smoke goes into the shortest group.
  smokes:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [cells, sheet-parity, areas-lang-sync, short]
    name: smokes (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Week number (cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: segments
          key: rd5-E10_N45-${{ steps.week.outputs.week }}
      - name: Routing data
        run: |
          mkdir -p segments
          [ -s segments/E10_N45.rd5 ] || curl -fsS --retry 3 -o segments/E10_N45.rd5 https://brouter.de/brouter/segments4/E10_N45.rd5
          ls -la segments

      - name: Playwright's Chromium
        working-directory: web/app
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      # group cells (~145 s)
      - name: A cell whose map fails (404, busy, 429, new generation, slow) – bounded tries, overview stays, strip says it, diagnostics
        if: matrix.group == 'cells'
        working-directory: web/app
        run: node test/cells-smoke.mjs $GITHUB_WORKSPACE/segments

      # group sheet-parity (~145 s)
      - name: Plan sheet steps (small / profile / Points on desktop and phone, handle, chevron, remembered; Share icon, place card)
        if: matrix.group == 'sheet-parity'
        working-directory: web/app
        run: node test/sheet-smoke.mjs $GITHUB_WORKSPACE/segments

      - name: Phone parity (first-point menu, undo / redo, eye, compass, Google link-out, GPX, bottom sheet)
        if: matrix.group == 'sheet-parity'
        working-directory: web/app
        run: node test/parity-smoke.mjs $GITHUB_WORKSPACE/segments

      # group areas-lang-sync (~145 s)
      - name: Never a blank map, every wait said, map areas on demand (fake doorman behind the host's proxy)
        if: matrix.group == 'areas-lang-sync'
        working-directory: web/app
        run: node test/areas-smoke.mjs $GITHUB_WORKSPACE/segments

      - name: German first (browser language, switch, engine texts, website links, the one line about the app, noindex)
        if: matrix.group == 'areas-lang-sync'
        working-directory: web/app
        run: node test/lang-smoke.mjs $GITHUB_WORKSPACE/segments

      - name: Plan sync (phase 2) – two browsers pair, sync both ways, offline + conflict copy, delete, unpair
        if: matrix.group == 'areas-lang-sync'
        working-directory: web/app
        run: node test/sync-smoke.mjs $GITHUB_WORKSPACE/segments

      # group short (~150 s)
      - name: Planner page click test (two points → route + profile; screenshot)
        if: matrix.group == 'short'
        working-directory: web/app
        run: node test/ui-smoke.mjs $GITHUB_WORKSPACE/segments

      - name: Plan per link and QR code (the app's code opens; same code written back; QR dialog)
        if: matrix.group == 'short'
        working-directory: web/app
        run: node test/share-smoke.mjs $GITHUB_WORKSPACE/segments

      - name: Plan edits with the app's PlanEdits / PlanPoints, activity switch re-plans
        if: matrix.group == 'short'
        working-directory: web/app
        run: node test/edit-smoke.mjs $GITHUB_WORKSPACE/segments

      - name: World overview below the cells (the app's Overview.merge; zoom 5 / 8 never blank)
        if: matrix.group == 'short'
        working-directory: web/app
        run: node test/overview-smoke.mjs $GITHUB_WORKSPACE/segments

      - name: Long-route question and GPX import (☰ → Import GPX, drop, Plan a route from it, export ⇄ import)
        if: matrix.group == 'short'
        working-directory: web/app
        run: node test/import-smoke.mjs $GITHUB_WORKSPACE/segments

      - name: Following the position ends on the page's own camera moves (search pick), compass keeps it
        if: matrix.group == 'short'
        working-directory: web/app
        run: node test/follow-smoke.mjs $GITHUB_WORKSPACE/segments

      - name: Where the time goes (numbers only, nothing checked)
        if: matrix.group == 'short'
        working-directory: web/app
        run: node test/perf.mjs normal $GITHUB_WORKSPACE/segments

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-smokes-${{ matrix.group }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            web/engine/build/*.json
            web/engine/build/*.png

  # Deploy: every green push to web-spike, or Actions → Web spike → Run workflow → deploy. Only when build, jvm and
  # every smoke group are green. Needs the repository secret CLOUDFLARE_PLANNER_TOKEN (Workers scripts, D1 edit + the
  # planner zone's routes/DNS, nothing else), the repository variables CLOUDFLARE_ACCOUNT_ID (exists), PLANNER_HOST_TEST
  # (e.g. plan.onpath.earth) and SYNC_D1_ID_TEST (the sync database, web-sync.md §10), and Cloudflare Access on that
  # host set up first (web-planner.md §9; /sync/* bypasses Access, the mailbox token guards it).
  deploy:
    needs: [build, jvm, smokes]
    # owner 2026-10-27: every green push to web-spike goes online (the test site is behind Cloudflare Access)
    if: inputs.deploy || (github.event_name == 'push' && github.ref == 'refs/heads/web-spike')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - name: Deploy the planner host (test)
        working-directory: web/host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLANNER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HOST: ${{ vars.PLANNER_HOST_TEST || 'plan.onpath.earth' }}
          SYNC_D1: ${{ vars.SYNC_D1_ID_TEST }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_PLANNER_TOKEN / CLOUDFLARE_ACCOUNT_ID missing – see web-planner.md §9, web-sync.md §10"; exit 1
          fi
          [ -s ../app/dist/index.html ] || { echo "::error::no built page in web/app/dist"; exit 1; }
          if [ -z "$SYNC_D1" ]; then # no variable: find the database by its name (cloudflare-setup.yml creates it)
            SYNC_D1=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=onpath-sync-test" \
              | jq -r '[.result[]? | select(.name == "onpath-sync-test")][0].uuid // empty')
            [ -n "$SYNC_D1" ] || { echo "::error::D1 database onpath-sync-test not found – run the Cloudflare setup workflow first"; exit 1; }
          fi
          sed -i "s/__PLANNER_HOST_TEST__/$HOST/; s/__SYNC_D1_ID_TEST__/$SYNC_D1/" wrangler.toml
          npx --yes wrangler@4.141.0 d1 migrations apply onpath-sync-test --env test --remote
          npx --yes wrangler@4.141.0 deploy --env test

      # Map areas on demand (web-planner.md §17): the host adds the doorman's app key to the two build calls, so the
      # browser never holds it. Owner step, once: repository secret ONPATH_MAP_KEY_TEST = the newest entry of the
      # environment "test" secret ONPATH_APP_KEYS (an environment secret is not readable here). Without it the page says
      # the area's map is not available on the web yet. The key goes from the secret straight into wrangler's stdin.
      - name: Map key for the planner host (map areas on demand)
        working-directory: web/host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLANNER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MAP_KEY: ${{ secrets.ONPATH_MAP_KEY_TEST }}
        run: |
          if [ -z "$MAP_KEY" ]; then
            echo "::notice::ONPATH_MAP_KEY_TEST not set – map areas cannot be requested from the web yet (web-planner.md §9, owner step 5)"; exit 0
          fi
          printf '%s' "$MAP_KEY" | npx --yes wrangler@4.141.0 secret put MAP_KEY --env test >/dev/null
          echo "MAP_KEY set on the planner host"

      # Live check after the deploy (web-planner.md §9, owner step 6 – optional): only when the Cloudflare Access service
      # token exists (repository secrets CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET, policy "Service Auth" on the
      # planner app). Reads the page, the engine, the overview, routing data and the map-area proxy – nothing is changed.
      - name: Live smoke test of the deployed planner (needs the Access service token)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          HOST: ${{ vars.PLANNER_HOST_TEST || 'plan.onpath.earth' }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::notice::no Access service token (CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET) – live smoke test skipped"; exit 0
          fi
          node web/host/live-smoke.mjs "https://$HOST/"

  # The results of every job in one artifact, as before (jvm / browser results, compare summary, screenshots).
  results:
    needs: [build, jvm, smokes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@v4
        continue-on-error: true # nothing to merge when the build failed
        with:
          name: web-spike-results
          pattern: results-*
          delete-merged: true
