# End-to-end tests of the core features (docs/core-features.md) on an Android emulator: the real app and map,
# a finger held on the screen (app/src/androidTest). Owner 2026-10-21: "not good to find out during walking".
#
# Runs on every push to main that touches the app, by hand, and as a gate inside release.yml (workflow_call).
name: E2E

on:
  push:
    branches: [main, e2e]
    paths:
      - "app/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app + test APKs (x86_64 for the emulator)
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -Ponpath.e2e=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Core feature tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Ponpath.e2e=true

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
