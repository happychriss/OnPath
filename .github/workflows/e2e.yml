# End-to-end tests of the core features (docs/core-features.md) on an Android emulator: the real app and map,
# a finger held on the screen (app/src/androidTest). Owner: "not good to find out during walking".
#
# Runs every night on main (only when main changed in the last day), before a release and by hand – no longer on
# every push (owner 2026-11-18: the 45–85 min run was cancelled by the next push and never finished on a busy day).
# The full run is split over 4 emulators side by side (the test runner's numShards / shardIndex); a run with a `tests`
# list (one class on demand: tools/ci/e2e_github.sh --tests …; release.yml: only StartSmokeE2ETest as its gate) uses one
# emulator. Without the Release-Rundgang (that runs locally on donald before a release made there:
# tools/ci/release_rundgang.sh, docs/release-rundgang.md). The screenshots (/sdcard/e2e) are always in the report
# "e2e-report-<shard>". A requested test class that produced no test case fails the run.
# The first map on a fresh install (FirstMapDownloadE2ETest) runs in its own job "first-map": the only build with the
# TEST map key, so no other test downloads real map areas.
name: E2E

on:
  schedule:
    - cron: "17 1 * * *" # 02:17 / 03:17 in Germany – after the day's pushes
  workflow_dispatch:
    inputs:
      tests:
        description: "Only these test classes (comma-separated, e.g. com.onpath.app.e2e.CorePointsListE2ETest); empty = all"
        required: false
        default: ""
  workflow_call:
    inputs:
      tests:
        description: "Only these test classes (release.yml: the start test)"
        type: string
        required: false
        default: ""

concurrency:
  # own queue per caller: the release's short start test never cancels (or waits for) the full run beside it
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The nightly run is skipped when nothing but docs / the planner changed on main since the last night.
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.look.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 200
      - id: look
        env:
          EVENT: ${{ github.event_name }}
        run: |
          n=1
          if [ "$EVENT" = schedule ]; then
            n=$(git log --since='25 hours ago' --format=%h -- . ':(exclude)docs' ':(exclude)web' ':(exclude)*.md' | wc -l)
          fi
          echo "commits that can change the app: $n"
          [ "$n" -gt 0 ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"

  emulator:
    needs: changed
    # the first-map class alone runs only in its own job below (here, without the key, it would only skip)
    if: needs.changed.outputs.run == 'true' && inputs.tests != 'com.onpath.app.e2e.FirstMapDownloadE2ETest'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # a `tests` list runs on one emulator, the full run on four
        shard: ${{ fromJSON(inputs.tests != '' && '[0]' || '[0, 1, 2, 3]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-36 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build app + test APKs (x86_64 for the emulator)
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -Ponpath.e2e=true

      - name: Week (routing data cache key)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Routing data cache
        id: rd5cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rd5
          key: brouter-E10_N45-${{ steps.week.outputs.week }}

      - name: Real routing data for the field tests (brouter.de, once a week)
        if: steps.rd5cache.outputs.cache-hit != 'true'
        run: mkdir -p rd5 && curl -fsSL --retry 3 -o rd5/E10_N45.rd5 https://brouter.de/brouter/segments4/E10_N45.rd5 && ls -la rd5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The started emulator is kept as a snapshot in the cache: later runs skip the cold boot.
      - name: Emulator snapshot cache
        id: avdcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-pixel_6-v1

      - name: Create the emulator + boot snapshot (only when not cached)
        if: steps.avdcache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator snapshot made for the cache."

      - name: Core feature tests on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c || true
            adb push rd5/E10_N45.rd5 /data/local/tmp/E10_N45.rd5 && adb shell chmod 644 /data/local/tmp/E10_N45.rd5 || true
            ./gradlew --no-daemon connectedDebugAndroidTest -Ponpath.e2e=true ${{ inputs.tests != '' && format('-Pandroid.testInstrumentationRunnerArguments.class={0}', inputs.tests) || format('-Pandroid.testInstrumentationRunnerArguments.notClass=com.onpath.app.e2e.ReleaseRundgang -Pandroid.testInstrumentationRunnerArguments.numShards=4 -Pandroid.testInstrumentationRunnerArguments.shardIndex={0}', matrix.shard) }} && R=0 || R=1; mkdir -p e2e-out; adb pull /sdcard/e2e e2e-out/ || true; [ $R = 0 ] || { adb logcat -d > e2e-out/logcat.txt || true; exit 1; }

      # Guard: 0.13.3's release asked for "StartSmokeE2ETest,ReleaseRundgang", only the start test ran and the job was
      # green (docs/release-rundgang.md). Every requested class (or Class#method) must show up in the JUnit XML with at
      # least one test case; without a list (full run, notClass) at least one test case in every shard.
      - name: Every requested test class ran
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          files = glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)
          cases = set()
          for f in files:
              for tc in ET.parse(f).getroot().iter("testcase"):
                  cases.add((tc.get("classname", ""), tc.get("name", "")))
          print("%d test cases in %d report(s)" % (len(cases), len(files)))
          wanted = [t.strip() for t in os.environ.get("TESTS", "").split(",") if t.strip()]
          missing = []
          for w in wanted:
              cls, _, method = w.partition("#")
              hits = [c for c in cases if c[0] == cls and (not method or c[1] == method)]
              print("%-60s %d test case(s)" % (w, len(hits)))
              if not hits: missing.append(w)
          if not cases: print("::error::No test case ran at all"); sys.exit(1)
          if missing: print("::error::Requested but never run: " + ", ".join(missing)); sys.exit(1)
          PY

      - name: Test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            e2e-out/
          if-no-files-found: ignore

  # The first map on a fresh install (FirstMapDownloadE2ETest, owner 2026-11-20): the one class that downloads real map
  # areas from the TEST map server. Only this job builds with the TEST map key – the job above builds without one, so no
  # other test downloads maps (and this class skips itself there). Built with the world overview like a released APK
  # (without it a fresh install shows the missing-data screen). No routing data pushed: the app loads it itself.
  # Runs with the nightly / full run and when its class is asked for; not in release.yml's start test.
  first-map:
    needs: changed
    if: needs.changed.outputs.run == 'true' && (inputs.tests == '' || contains(inputs.tests, 'FirstMapDownloadE2ETest'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # job-wide: Gradle reads it when it configures, so the test run sees the same key as the build (no rebuild without it)
      ONPATH_MAP_KEY_TEST: ${{ secrets.ONPATH_MAP_KEY_TEST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The TEST map key is set
        run: |
          if [ -z "$ONPATH_MAP_KEY_TEST" ]; then echo "::error::repository secret ONPATH_MAP_KEY_TEST is empty – the first-map test cannot download"; exit 1; fi
          echo "TEST map key present"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-36 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # the files release.yml puts into the APK (docs/map-pipeline.md §9b), checked against their SHA256SUMS
      - name: World overview map
        env:
          OVERVIEW_URL: ${{ vars.ONPATH_OVERVIEW_URL || 'https://github.com/happychriss/OnPath/releases/download/overview-2026-10-22/' }}
        run: |
          DIR="$RUNNER_TEMP/overview-assets/overview"
          mkdir -p "$DIR"
          for f in SHA256SUMS base.pmtiles hillshade.pmtiles; do
            curl -fsSL --retry 5 --retry-delay 5 -o "$DIR/$f" "${OVERVIEW_URL%/}/$f"
          done
          (cd "$DIR" && grep -E ' \*?(base|hillshade)\.pmtiles$' SHA256SUMS | sha256sum -c -) && rm "$DIR/SHA256SUMS"
          echo "ONPATH_OVERVIEW_ASSETS=$RUNNER_TEMP/overview-assets" >> "$GITHUB_ENV"

      - name: Build app + test APKs with the TEST map key (x86_64 for the emulator)
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -Ponpath.e2e=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator snapshot cache
        id: avdcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-pixel_6-v1

      - name: Create the emulator + boot snapshot (only when not cached)
        if: steps.avdcache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator snapshot made for the cache."

      - name: First map download on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c || true
            ./gradlew --no-daemon connectedDebugAndroidTest -Ponpath.e2e=true -Pandroid.testInstrumentationRunnerArguments.class=com.onpath.app.e2e.FirstMapDownloadE2ETest && R=0 || R=1; mkdir -p e2e-out; adb pull /sdcard/e2e e2e-out/ || true; adb logcat -d -s FirstMapDownloadE2E:I > e2e-out/first-map.txt || true; [ $R = 0 ] || { adb logcat -d > e2e-out/logcat.txt || true; exit 1; }

      # a skipped test case would be green without testing anything (e.g. the key did not reach the build). The Android
      # test runner writes a skip (a failed assumption) into the JUnit XML as a <failure> with AssumptionViolatedException
      # while Gradle counts it as passed – both forms count as skipped here.
      - name: The first-map test ran and was not skipped
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          ran = skipped = 0
          for f in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  if tc.get("classname", "").endswith("FirstMapDownloadE2ETest"):
                      ran += 1
                      if tc.find("skipped") is not None or any("AssumptionViolatedException" in (f.text or "") for f in tc.iter("failure")):
                          skipped += 1
          print("FirstMapDownloadE2ETest: %d test case(s), %d skipped" % (ran, skipped))
          if ran == 0: print("::error::FirstMapDownloadE2ETest never ran"); sys.exit(1)
          if skipped: print("::error::FirstMapDownloadE2ETest was skipped – the build had no TEST map key"); sys.exit(1)
          PY

      - name: Test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-first-map
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            e2e-out/
          if-no-files-found: ignore
