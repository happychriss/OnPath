# End-to-end tests of the core features (docs/core-features.md) on an Android emulator: the real app and map,
# a finger held on the screen (app/src/androidTest). Owner 2026-10-21: "not good to find out during walking".
#
# Runs on every push to main that touches the app, by hand, and as a gate inside release.yml (workflow_call).
name: E2E

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app + test APKs (x86_64 for the emulator)
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -Ponpath.e2e=true

      - name: Week (routing data cache key)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Routing data cache
        id: rd5cache
        uses: actions/cache@v4
        with:
          path: rd5
          key: brouter-E10_N45-${{ steps.week.outputs.week }}

      - name: Real routing data for the field tests (brouter.de, once a week)
        if: steps.rd5cache.outputs.cache-hit != 'true'
        run: mkdir -p rd5 && curl -fsSL --retry 3 -o rd5/E10_N45.rd5 https://brouter.de/brouter/segments4/E10_N45.rd5 && ls -la rd5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Core feature tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c || true
            adb push rd5/E10_N45.rd5 /data/local/tmp/E10_N45.rd5 && adb shell chmod 644 /data/local/tmp/E10_N45.rd5 || true
            ./gradlew --no-daemon connectedDebugAndroidTest -Ponpath.e2e=true || (mkdir -p e2e-out; adb pull /sdcard/e2e e2e-out/ || true; adb logcat -d > e2e-out/logcat.txt || true; exit 1)

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            e2e-out/
          if-no-files-found: ignore
