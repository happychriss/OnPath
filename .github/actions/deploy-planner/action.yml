# Deploy the planner host (test) from this run's web-build artifact – used by web.yml's deploy and deploy-quick jobs.
# The job checks out the repo first (this action is local). Secrets come in as inputs (a composite action cannot read them).
name: Deploy the planner
description: plan.onpath.earth (test) from the web-build artifact – wrangler deploy, map key, optional live smoke
inputs:
  cloudflare-token: { required: false, default: "" }
  cloudflare-account: { required: false, default: "" }
  host: { required: false, default: plan.onpath.earth }
  sync-d1: { required: false, default: "" }
  map-key: { required: false, default: "" }
  access-id: { required: false, default: "" }
  access-secret: { required: false, default: "" }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - uses: actions/download-artifact@v4
      with:
        name: web-build
        path: web

    - name: Deploy the planner host (test)
      shell: bash
      working-directory: web/host
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account }}
        HOST: ${{ inputs.host }}
        SYNC_D1: ${{ inputs.sync-d1 }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "::error::CLOUDFLARE_PLANNER_TOKEN / CLOUDFLARE_ACCOUNT_ID missing – see web-planner.md §9, web-sync.md §10"; exit 1
        fi
        [ -s ../app/dist/index.html ] || { echo "::error::no built page in web/app/dist"; exit 1; }
        if [ -z "$SYNC_D1" ]; then # no variable: find the database by its name (cloudflare-setup.yml creates it)
          SYNC_D1=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=onpath-sync-test" \
            | jq -r '[.result[]? | select(.name == "onpath-sync-test")][0].uuid // empty')
          [ -n "$SYNC_D1" ] || { echo "::error::D1 database onpath-sync-test not found – run the Cloudflare setup workflow first"; exit 1; }
        fi
        sed -i "s/__PLANNER_HOST_TEST__/$HOST/; s/__SYNC_D1_ID_TEST__/$SYNC_D1/" wrangler.toml
        npx --yes wrangler@4.141.0 d1 migrations apply onpath-sync-test --env test --remote
        npx --yes wrangler@4.141.0 deploy --env test

    # Map areas on demand (web-planner.md §17): the host adds the doorman's app key to the two build calls, so the
    # browser never holds it. Owner step, once: repository secret ONPATH_MAP_KEY_TEST = the newest entry of the
    # environment "test" secret ONPATH_APP_KEYS (an environment secret is not readable here). Without it the page says
    # the area's map is not available on the web yet. The key goes from the secret straight into wrangler's stdin.
    - name: Map key for the planner host (map areas on demand)
      shell: bash
      working-directory: web/host
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account }}
        MAP_KEY: ${{ inputs.map-key }}
      run: |
        if [ -z "$MAP_KEY" ]; then
          echo "::notice::ONPATH_MAP_KEY_TEST not set – map areas cannot be requested from the web yet (web-planner.md §9, owner step 5)"; exit 0
        fi
        printf '%s' "$MAP_KEY" | npx --yes wrangler@4.141.0 secret put MAP_KEY --env test >/dev/null
        echo "MAP_KEY set on the planner host"

    # Live check after the deploy (web-planner.md §9, owner step 6 – optional): only when the Cloudflare Access service
    # token exists (repository secrets CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET, policy "Service Auth" on the
    # planner app). Reads the page, the engine, the overview, routing data and the map-area proxy – nothing is changed.
    - name: Live smoke test of the deployed planner (needs the Access service token)
      shell: bash
      env:
        CF_ACCESS_CLIENT_ID: ${{ inputs.access-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.access-secret }}
        HOST: ${{ inputs.host }}
      run: |
        if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
          echo "::notice::no Access service token (CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET) – live smoke test skipped"; exit 0
        fi
        node web/host/live-smoke.mjs "https://$HOST/"
